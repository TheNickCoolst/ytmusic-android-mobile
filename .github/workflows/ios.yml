name: iOS build (unsigned IPA)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/ios.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: oven-sh/setup-bun@v2

      - name: Build web app + sync iOS
        working-directory: frontend
        run: |
          bun install --frozen-lockfile
          bun run build
          npx cap sync ios

      - name: Build iOS app (no signing – Sideloadly/AltStore sign it with your Apple ID)
        working-directory: frontend/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -40

      - name: Package IPA
        working-directory: frontend/ios/App
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry ../../../ytmusic-mobile.ipa Payload
          ls -la ../../../ytmusic-mobile.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: ytmusic-mobile-ipa
          path: ytmusic-mobile.ipa

      - name: Publish as "ios-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view ios-latest >/dev/null 2>&1 || \
            gh release create ios-latest --title "iPhone-Version (neuester Stand)" --prerelease \
              --notes "Unsignierte iPhone-App. Mit Sideloadly (sideloadly.io) und deiner Apple-ID aufs iPhone installieren."
          gh release upload ios-latest ytmusic-mobile.ipa --clobber
